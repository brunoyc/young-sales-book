  /* ============================================================
     YOUNG.Sales brand tokens — extracted from the YOUNG.Sales
     Design System v1.0 (index_2.html candidate brief).
     Light-only by deliberate brand decision (source explicitly
     disables dark mode); no radius, no shadow, anywhere.
     ============================================================ */
  :root {
    --klein: #002fa7;
    --klein-tint: #eef1fb;
    --ink: #0a1633;
    --steel: #3d4f76;
    --white: #ffffff;
    --tbc: #b4531a;
    --tbc-tint: #b4531a14;
    --rule: rgba(0, 47, 167, 0.22);
    --rule-on-klein: rgba(255, 255, 255, 0.25);

    --font-display: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Instrument Serif', Georgia, 'Iowan Old Style', serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --container: 1180px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--white);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--klein-tint); color: var(--ink); }
  a { color: var(--klein); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { color: var(--ink); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--klein); outline-offset: 2px; }

  /* ---------- Klein band (masthead) ---------- */
  .masthead {
    background: var(--klein);
    color: var(--white);
    padding: 40px clamp(22px, 4vw, 32px) 56px;
  }
  .masthead-inner { max-width: var(--container); margin: 0 auto; }
  .masthead-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .masthead-eyebrow {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
  }
  .lang-switch { display: flex; gap: 6px; }
  .lang-btn {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.6);
    background: none;
    border: 1px solid rgba(255, 255, 255, 0.35);
    padding: 5px 10px;
    cursor: pointer;
  }
  .lang-btn:hover { color: var(--white); border-color: rgba(255, 255, 255, 0.7); }
  .lang-btn.is-active { color: var(--klein); background: var(--white); border-color: var(--white); }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.2rem, 1.5rem + 3vw, 4.2rem);
    line-height: 1.04;
    letter-spacing: -0.03em;
    margin: 0;
    text-wrap: balance;
    color: var(--white);
  }
  .masthead h1 .dim { color: rgba(255, 255, 255, 0.6); }
  .masthead .statement {
    max-width: 62ch;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.2rem, 1rem + 1vw, 1.6rem);
    letter-spacing: -0.01em;
    line-height: 1.35;
    color: var(--white);
    margin: 22px 0 0;
  }

  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px;
    background: var(--rule-on-klein);
    border: 1px solid var(--rule-on-klein);
    margin-top: 40px;
  }
  .stat {
    min-width: 0;
    background: var(--klein);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat b {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--white);
  }
  .stat span {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.68);
  }

  /* ---------- Sales process (light section) ---------- */
  .process {
    max-width: var(--container);
    margin: 0 auto;
    padding: 64px clamp(22px, 4vw, 32px) 8px;
  }
  .process .eyebrow {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--klein);
  }
  .process h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2.4rem);
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 10px 0 0;
    max-width: 26ch;
  }
  .process .statement-light {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.1rem, 1rem + 0.6vw, 1.35rem);
    letter-spacing: -0.01em;
    line-height: 1.4;
    color: var(--klein);
    max-width: 62ch;
    margin: 18px 0 0;
  }
  .sub-eyebrow {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--klein);
    margin-top: 48px;
  }
  .sub-h3 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
    margin: 8px 0 0;
  }
  .sub-intro {
    font-family: var(--font-body);
    font-size: 0.95rem;
    color: var(--steel);
    max-width: 70ch;
    margin: 8px 0 0;
  }

  .diagram-wrap { margin: 40px 0 8px; overflow-x: auto; }
  .diagram-wrap svg { display: block; min-width: 760px; width: 100%; height: auto; color: var(--klein); }
  .diagram-wrap figcaption {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--steel);
    margin-top: 10px;
  }

  .dtable-wrap { overflow-x: auto; margin: 4px 0 14px; }
  table.dtable { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.dtable th, table.dtable td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  table.dtable th {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--steel);
    font-weight: 500;
  }
  table.dtable td { font-variant-numeric: tabular-nums; }

  function decodeEntities(str) {
    const ta = document.createElement('textarea');
    ta.innerHTML = str;
    return ta.value;
  }

  function applyLang(lang) {
    const S = STR[lang];
    document.documentElement.lang = lang;
    localStorage.setItem('sb-lang', lang);

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (S[key] != null) el.innerHTML = S[key];
    });

    Object.keys(S.svg1).forEach(k => {
      if (k === 'aria') { document.getElementById('svg1').setAttribute('aria-label', S.svg1.aria); return; }
      if (k === 'caption') { document.getElementById('t1_caption').textContent = S.svg1.caption; return; }
      const el = document.getElementById('t1_' + k);
      if (el) el.textContent = S.svg1[k];
    });

    Object.keys(S.svg2).forEach(k => {
      if (k === 'aria') { document.getElementById('svg2').setAttribute('aria-label', S.svg2.aria); return; }
      if (k === 'caption') { document.getElementById('t2_caption').textContent = S.svg2.caption; return; }
      const el = document.getElementById('t2_' + k);
      if (el) el.textContent = S.svg2[k];
    });

    document.getElementById('legendHeadStep').textContent = S.legendHeadStep;
    document.getElementById('legendHeadWhat').textContent = S.legendHeadWhat;
    document.getElementById('legend-body').innerHTML = S.legend.map(row =>
      `<tr><td>${decodeEntities(row[0])}</td><td>${decodeEntities(row[1])}</td></tr>`
    ).join('');

    const vgridEl = document.getElementById('vertical-grid');
    vgridEl.innerHTML = BUSINESS_ORDER.map(id => {
      const p = S.playbook[id];
      return `
        <div class="vcard">
          <h3>${decodeEntities(S.businessNames[id])}</h3>
          <dl>
            <dt>${decodeEntities(S.vLabelEntry)}</dt><dd>${decodeEntities(p.entry)}</dd>
            <dt>${decodeEntities(S.vLabelClose)}</dt><dd>${decodeEntities(p.close)}</dd>
            <dt>${decodeEntities(S.vLabelSupport)}</dt><dd>${decodeEntities(p.support)}</dd>
          </dl>
        </div>`;
    }).join('');

    const listEl = document.getElementById('handoff-list');
    let html = '';
    S.dmSteps.forEach((step, i) => {
      if (i === 3) {
        html += `<li class="handoff-decision">
          <div class="hd-label">${decodeEntities(S.dmDecisionLabel)}</div>
          <div class="hd-branch"><span class="hd-tag">${decodeEntities(S.dmDecisionIf)}</span><span class="hd-text">${decodeEntities(S.dmDecisionIfText)}</span></div>
          <div class="hd-branch"><span class="hd-tag">${decodeEntities(S.dmDecisionOr)}</span><span class="hd-text">${decodeEntities(S.dmDecisionOrText)}</span></div>
        </li>`;
      }
      if (i === 7) html += `<li class="handoff-divider">${decodeEntities(S.dmDivider)}</li>`;
      html += `<li><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${decodeEntities(step.t)}</span><span class="actor">${decodeEntities(step.actor)}</span></li>`;
    });
    listEl.innerHTML = html;

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('is-active', b.dataset.lang === lang));
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  const saved = localStorage.getItem('sb-lang');
  const browser = (navigator.language || 'en').slice(0, 2);
  const initial = STR[saved] ? saved : (STR[browser] ? browser : 'en');
  applyLang(initial);
})();
</script>
